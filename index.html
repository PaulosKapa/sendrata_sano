<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body onload="drop_or_input_func(), add_label(), add_level(), get_level(), add_item_level()">
    <div id="container">
        <div id="levels">
            
        </div>
        <div id="buttons">
            <div id="add_item">
                <button onclick="drop_or_input_func(), add_label(), add_level(), get_level(), add_item_level()">ADD LEVEL</button>
                <button onclick="add_to_list()">ADD ITEM</button>
                <button onclick="remove_from_list()">REMOVE ITEM</button>
                <button onclick="remove_level(), replace_lost()">REMOVE LEVEL</button>
                <button onclick="submit_func()">SUBMIT</button>
            </div>
        </div>
        <div id="item_selector">
            <select name="selector" id="item_list_selector">
                <option value="blood_type" onclick="drop_or_input_func(), choose()">blood_type</option>
                <option value="description" onclick="drop_or_input_func(), choose()">description</option>
            </select>
        </div>
        <div id="text"></div>
        <div id="ol_list"></div>
        <div id="dropdown_menu"></div>
    </div>
</body>
<script>
    //check how many levels we have
    var lvl = 0;
    //make a new array
    var output=[];
    //add a new radio inside the label (add_label) and increase the lvl by 1
    //check if we need a dropdown menu or description
    var drop_or_input;
    //save the variables
    var save = {};
    var ArrayOfAllFoundVariables = [];
    function add_level(){
        choose();
        //make level into a string
        let text_content = "level" + lvl;      
        //create a input element to output the current level
        let new_level = document.createElement("input");
        //set the type of the new_level
        new_level.type="radio";
        //get the id of the levels
        let level_id = document.getElementById(text_content);
        //add the new_level element to the level_id 
        level_id.appendChild(new_level);
        //add a class to new_level
        new_level.classList.add("level");
        //add name attribute so it doesn't let to check multiple radios
        new_level.setAttribute("name", "checker");
        //add the value attribut
        new_level.setAttribute("value", text_content);
        //add functions to the radio button
        new_level.setAttribute("onclick", "get_level()", "delete_text()");
        //check the new radio
        new_level.checked=true;
        //get the element with the id item if drop_or_input==input
        if(drop_or_input == "input"){
            let text = document.getElementById("item");
            //delete text.value
            text.value="";
            //add a new level
        }
        lvl += 1;
        if(lvl==2){
            //uncomment this
       //     alert("From this level and forward only responders can read your information");
        }
    }
    //remove the current level
    function remove_level(){
        //get the current lvl
        let level_value=output[0];
        //remove level from the string
        let new_level_value = level_value.replace('level', '');
        //turn the string to an int
        let number_value = Number(new_level_value)
        //only if number_value and lvl are greater than zero
        if(number_value>0 && lvl>0){
            let item_list =  "item_list"+output;
            //get element by id item_list
            let ol_list = document.getElementById(item_list);
            //get the element by id output
            let current_level = document.getElementById(output);
            //decrease the current lvl by 1
            let new_number_value = number_value -1;
            //turn it to a string
            let level_number_value = "level" + new_number_value
            //get the elements with class level
            let new_radio = document.getElementsByClassName("level");
            //check the previous radio
            new_radio[new_number_value].checked = true;
            //remove radio and least
            current_level.remove()
            ol_list.remove()
            //set a new current level
            output[0]=level_number_value;
            //decrease total levels
            lvl-=1
            
    }
}
//when removing a level, check if this level was one of the middle ones. If so, change the serial numbers of the others to replace the order
function replace_lost(){
        let i;
        //get the current lvl
        let level_value=output[0];
        //remove level from the string
        let new_level_value = level_value.replace('level', '');
        //turn the string to an int
        let number_value = Number(new_level_value)
        let number_search = "level" + (number_value + 1);
        if(document.getElementById(number_search)==null && number_value+1<lvl){
            for(i=0;i<lvl;i++){
                let next_number_value = number_value + 2;
                let label_id = "level" + next_number_value
                let label_id_set = "level" + (number_value + 1)
                let label_tag = document.getElementById(label_id)
                label_tag.setAttribute("id", label_id_set)
                label_tag.innerText = label_id_set
                output[0]=label_id_set
            }
        }
}
    //add the label to the level radio
    function add_label(){
        let new_label = document.createElement("label");
        //make level into a string
        let text_content = "level" + lvl;
        //the text to use in the new_level element
        let text = document.createTextNode(text_content);
        //search for the desc element
        let input_id = document.getElementById("levels");
        //add new_label to input_id
        input_id.appendChild(new_label);
        //set the id to new_label
        new_label.setAttribute("id", text_content)
        //add the text (i.e.: level1) to the new_level element
        new_label.appendChild(text);
}
//add an item to a list
function add_to_list(){
    let item_list =  "item_list"+output;
    //create a list item
    let node = document.createElement("li");
    //set the class of node
    node.setAttribute("class","list_item");
    //get the element with the id item if drop_or_input == input
    if(drop_or_input == "input"){
        let text = document.getElementById("item");
        //create a text using the value if the input
        let textnode = document.createTextNode(text.value);
        if (text.value == ""){
            //if text.value is nothing do nothing
        }
        else{
            //add the textnode to the node
            node.appendChild(textnode);
            //get the element with the is item_list and add node as a child
            document.getElementById(item_list).appendChild(node);
            //make the value of the item zero
            text.value="";
        }
    }
    //get the element with the id drop menu if the drop_or_input = drop
    else{
        let choise = document.getElementById("drop_menu");
        //get the text of the selected option
        let choise_value = choise.options[choise.selectedIndex].text
        //create a text using the value if the input
        let textnode = document.createTextNode(choise_value);
        //add the textnode to the node
        node.appendChild(textnode);
        //get the element with the is item_list and add node as a child
        document.getElementById(item_list).appendChild(node);

    }
}
//get the current level and delete the last item of the list
function remove_from_list(){
    //get the current lvl
    let item_list =  "item_list"+output;
    //get element by id item_list
    let ol_list = document.getElementById(item_list);
    //find the text of the last child
    let last_item = ol_list.lastChild.innerText;
    //if it matches "level", dont delete it, otherwise delete it
    if(last_item.indexOf("level")>-1){
        
    }

    }
    
}
//get the current level we are in
function get_level(){
    //get the name of the radio that is pressed
    let level_value = document.querySelectorAll('input[name="checker"]:checked');
    //add the level_value.value to the output
    output = []
    for (let i = 0; i < level_value.length; i++) {
        output.push(level_value[i].value);
    }
    //call the dropdown function
}
//get the current level we are in and add a new item to the list of that level
function add_item_level(){
        //set the item_list to a string
        let item_list = "item_list" + output;
        //create a list 
        let new_list = document.createElement("ol");
        //create a list item
        let new_level = document.createElement("li");
        //add a new text node
        let new_level_text = document.createTextNode(output);
        //add that text node to a list item
        new_level.appendChild(new_level_text);
        //set the id of the list to item_list
        new_list.setAttribute("id", item_list);
        //get the id of ol_list
        let ol_list = document.getElementById("ol_list");
        //add new_list to ol_list
        ol_list.appendChild(new_list);
        //add new_level under new_list
        new_list.appendChild(new_level);
}

//delete the text of the input
function delete_text(){
        //get the element with the id item
        if(drop_or_input == "input"){
            let text = document.getElementById("item");
            //delete text.value
            text.value="";
    }
}
//make a dropdown menu or input dialog according to the item_selector

    let input = document.createElement("input");

    input.setAttribute("id", "item");

function drop_or_input_func(){
    //get the element with id item_list_selector
    let select_menu_drop = document.getElementById("item_list_selector")
    let selected_value = select_menu_drop.options[select_menu_drop.selectedIndex].value
    if(selected_value == "blood_type"){
        drop_or_input = "drop";
    }
    else if(selected_value == "description"){
        drop_or_input = "input";
    }
}
//get the lists and turn them to arrays
function submit_func(){
    //get element with id ol_list
    let list_initial = document.getElementById("ol_list");
    //see how many children it has
    let numb = list_initial.childElementCount;
    let i, j;
    //loop for how many chilren the list has
    for(i=0; i<numb; i++){
        //create a new variable
        this["array"+i] = [];
        //make a var to get the id we want
        let tag_name = "item_listlevel" + i;
        //check how many children the child node of the <ol> has
        this["list_level"+i] = document.getElementById(tag_name).childElementCount;
        //loop for how many children the <ol> has
        for(j=0; j<this["list_level"+i]; j++){
            //get the jth child node
            this["repeat_list"+j] = document.getElementById(tag_name).childNodes[j];
            //get the text
            this["lists"+j] = this["repeat_list"+j].innerText
            //save the text to the array
            this["array"+i].push(this["lists"+j])
            // document.cookie = "newarray = array1"
            // let x = document.cookie;
            // console.log(x);
        }
    }
    //search for variables that start with array and end with a number 0-9
     var pattern = /^array[0-9]+/;
     //search everywhere
     for (var varName in window) {
        //if there is a match add it to the array
         if (pattern.test(varName)) {
            ArrayOfAllFoundVariables.push(window[varName]);
        }
    }
    console.log(ArrayOfAllFoundVariables)
}
